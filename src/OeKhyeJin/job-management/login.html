<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in - CariMakan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/loginsignup.css" />
  </head>
  <body>
    <div class="logo">Cari<span>Makan</span></div>

    <div class="auth-wrapper">
      <div class="auth-card">
        <h1>Sign in</h1>

        <!-- src/OeKhyeJin/job-management/login.html -->
        <form id="loginForm" novalidate>
          <div class="field floating">
            <input type="email" id="email" placeholder=" " />
            <label for="email">Email</label>
            <span class="field-error" id="emailError"></span>
          </div>

          <div class="field floating">
            <div class="password-wrapper">
              <input type="password" id="password" placeholder=" " />
              <label for="password">Password</label>
              <button
                type="button"
                class="toggle-visibility"
                id="togglePassword"
              >
                Show
              </button>
            </div>
            <span class="field-error" id="passwordError"></span>
          </div>

          <a href="forgot-password.html" class="forgot-link"
            >Forgot password?</a
          >

          <button type="submit" class="signin-btn">Sign in</button>

          <p id="errorMsg" class="error"></p>
        </form>
      </div>

      <p class="signup-prompt">
        New to CariMakan? <a href="signup.html">Join now</a>
      </p>
    </div>

    <script type="module" src="js/login.js"></script>
  </body>
</html>
