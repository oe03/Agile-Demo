<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employer Dashboard - CariMakan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="../../shared/logo.css" />
    <link rel="stylesheet" href="../../shared/account-menu.css" />
  </head>
  <body>
    <header class="topbar">
      <a href="#" id="logoLink" class="logo">Cari<span>Makan</span></a>
      <nav class="topnav">
        <a href="employer-dashboard.html" class="active">Dashboard</a>
        <a href="candidates.html">View Applied Candidates</a>

        <div class="account-menu">
          <button id="accountMenuBtn" class="account-menu-trigger">
            Account ▾
          </button>
          <div class="account-dropdown" id="accountDropdown">
            <a href="../../LoTzeKhang/user-authentication/profile.html"
              >My Account</a
            >
            <button id="logoutBtn">Log Out</button>
          </div>
        </div>
      </nav>
    </header>

    <main class="split-page">
      <div class="split-header">
        <h1 id="welcomeMsg">Loading...</h1>
      </div>

      <div class="split-container">
        <div class="split-left">
          <h2 class="section-title">Your Job Postings</h2>
          <div id="jobsList" class="jobs-list-compact">
            <p class="empty-state">Loading your job postings...</p>
          </div>
        </div>

        <div class="split-right">
          <div id="detailPanel" class="detail-panel">
            <p class="empty-state">Select a job on the left to view details.</p>
          </div>
        </div>
      </div>
    </main>

    <a href="post-jobs.html" class="fab" aria-label="Post a new job">+</a>

    <script type="module" src="js/employer-dashboard.js"></script>
    <script type="module">
      import { initLogoNav } from "../../shared/logo-nav.js";
      initLogoNav();
    </script>
    <script type="module">
      import { initAccountMenu } from "../../shared/account-menu.js";
      initAccountMenu();
    </script>
  </body>
</html>
