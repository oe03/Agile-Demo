<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Listings - CariMakan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #2C3E50;
      --primary-hover: #1F2D3A;
      --bg: #F5F7F8;
      --card-bg: #FFFFFF;
      --border: #DCE3E8;
      --text: #1B2631;
      --text-muted: #6B7C93;
      --error: #C0392B;
      --success: #27AE60;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      min-height: 100vh;
    }

    /* ---------- Top bar ---------- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 40px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 20px;
      color: var(--primary);
    }

    .logo span { color: var(--text-muted); }

    .topnav { display: flex; align-items: center; gap: 20px; }

    .topnav a {
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .topnav a:hover { color: var(--primary); }
    .topnav a.active { color: var(--primary); font-weight: 600; }

    .logout-btn {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .logout-btn:hover { border-color: var(--primary); color: var(--primary); }

    /* ---------- Split layout ---------- */
    .split-page { padding: 32px 40px 100px; }

    .split-header { max-width: 1200px; margin: 0 auto 24px; }

    .split-header h1 {
      font-size: 24px;
      font-weight: 600;
      color: var(--text);
      margin: 0;
    }

    .split-container {
      display: flex;
      gap: 24px;
      max-width: 1200px;
      margin: 0 auto;
      align-items: flex-start;
    }

    .split-left {
      flex: 0 0 380px;
      max-height: calc(100vh - 180px);
      overflow-y: auto;
    }

    .split-right {
      flex: 1;
      position: sticky;
      top: 24px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-muted);
      margin: 0 0 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ---------- Compact job cards (left column) ---------- */
    .jobs-list-compact { display: flex; flex-direction: column; gap: 10px; }

    .job-card-compact {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
      cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .job-card-compact:hover { border-color: var(--primary); }

    .job-card-compact.active {
      border-color: var(--primary);
      border-width: 2px;
      box-shadow: 0 2px 12px rgba(44, 62, 80, 0.1);
    }

    .job-card-compact h3 {
      margin: 0 0 4px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .job-company { font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
    .job-meta-compact { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    .job-salary-compact { font-size: 12px; font-weight: 500; color: var(--primary); }

    /* ---------- Detail panel (right column) ---------- */
    .detail-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      max-height: calc(100vh - 180px);
      overflow-y: auto;
    }

    .detail-header h2 {
      margin: 0 0 4px;
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
    }

    .detail-company { font-size: 15px; color: var(--text-muted); margin-bottom: 16px; }
    .detail-info-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .detail-info-item { font-size: 14px; color: var(--text); text-align: left; }
    .detail-posted { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
    .detail-section { margin-bottom: 24px; }
    
    .detail-section h3 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 0 0 10px;
    }

    .detail-section p {
      font-size: 14px;
      color: var(--text);
      line-height: 1.6;
      margin: 0;
      white-space: pre-wrap;
    }

    /* ---------- Job skills tags ---------- */
    .job-skills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

    .skill-tag {
      background: var(--bg);
      color: var(--text-muted);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .apply-btn {
      display: inline-block;
      padding: 10px 24px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .apply-btn:hover { background: var(--primary-hover); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="logo">Cari<span>Makan</span></div>
    <nav class="topnav">
      <a href="job-listings.html" class="active">Job Listings</a>
      <button id="logoutBtn" class="logout-btn">Log Out</button>
    </nav>
  </header>

  <main class="split-page">
    <div class="split-header">
      <h1>Available Jobs</h1>
    </div>

    <div class="split-container">
      
      <div class="split-left">
        <div class="section-title">All Jobs</div>
        <div class="jobs-list-compact" id="jobsList">
          <p style="padding: 15px; color: var(--text-muted);">Fetching vacancies...</p>
        </div>
      </div>

      <div class="split-right">
        <div class="detail-panel" id="detailPanel">
          <p style="text-align: center; color: var(--text-muted); padding: 40px 0;">
            Select a job position card on the left panel to review details.
          </p>
        </div>
      </div>

    </div>
  </main>

  <script type="module" src="js/job-listing.js"></script>
</body>
</html>
