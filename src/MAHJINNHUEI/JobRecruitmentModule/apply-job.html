<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply for Job - CariMakan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #2C3E50;
      --primary-hover: #1F2D3A;
      --bg: #F5F7F8;
      --card-bg: #FFFFFF;
      --border: #DCE3E8;
      --text: #1B2631;
      --text-muted: #6B7C93;
      --error: #C0392B;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 40px 20px; }
    .form-container { max-width: 600px; margin: 0 auto; background: var(--card-bg); padding: 32px; border: 1px solid var(--border); border-radius: 12px; }
    h1 { margin: 0 0 8px 0; font-size: 24px; font-weight: 600; }
    p.subtitle { color: var(--text-muted); margin: 0 0 24px 0; font-size: 14px; }
    .form-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 14px; font-weight: 500; }
    input[type="text"], input[type="email"], textarea {
      padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 14px; width: 100%;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--primary); }
    .btn-submit { background: var(--primary); color: white; padding: 12px 24px; border: none; border-radius: 20px; font-weight: 600; cursor: pointer; font-size: 14px; width: 100%; margin-top: 10px; }
    .btn-submit:hover { background: var(--primary-hover); }
    .error-banner { color: var(--error); font-size: 14px; margin-top: 10px; display: none; text-align: center; }
  </style>
</head>
<body>

  <div class="form-container">
    <h1>Submit Application</h1>
    <p class="subtitle" id="jobTitleSubtitle">Applying for position...</p>

    <form id="applicationForm">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" required placeholder="John Doe">
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="john@example.com">
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="text" id="phone" required placeholder="+60123456789">
      </div>

      <div class="form-group">
        <label for="coverLetter">Cover Letter (Optional)</label>
        <textarea id="coverLetter" rows="5" placeholder="Tell the employer why you're a great fit..."></textarea>
      </div>

      <div class="form-group">
        <label for="resume">Upload Resume (PDF or DOCX)</label>
        <input type="file" id="resume" accept=".pdf,.docx" required>
      </div>

      <button type="submit" class="btn-submit">Submit Application</button>
      <div style="text-align: center; margin-top: 16px;">
        <a href="job-listings.html" style="color: #6B7C93; text-decoration: none; font-size: 14px; font-weight: 500; display: inline-block; padding: 8px 16px;">
        ← Cancel & Return to Jobs
        </a>
        </div>
      <div class="error-banner" id="errorBanner"></div>
    </form>
  </div>

  <script type="module" src="js/application-form.js"></script>
</body>
</html>
