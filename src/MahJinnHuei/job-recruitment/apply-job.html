<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apply for Job - CariMakan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/apply-job.css" />
    <link rel="stylesheet" href="../../shared/logo.css" />
    <link rel="stylesheet" href="../../shared/account-menu.css" />
  </head>
  <body>
    <header class="topbar">
      <a href="#" id="logoLink" class="logo">Cari<span>Makan</span></a>
      <nav class="topnav">
        <a href="job-listings.html">Job Listings</a>

        <div class="account-menu">
          <button id="accountMenuBtn" class="account-menu-trigger">
            Account ▾
          </button>
          <div class="account-dropdown" id="accountDropdown">
            <a href="../../LoTzeKhang/user-authentication/profile.html"
              >My Account</a
            >
            <button id="logoutBtn">Log Out</button>
          </div>
        </div>
      </nav>
    </header>

    <main class="page-content">
      <div class="form-card">
        <h1>Apply for this Job</h1>
        <p class="job-subtitle" id="jobSubtitle">Loading...</p>

        <form id="applyForm" novalidate>
          <h2 class="section-label">Your Details</h2>

          <div class="field floating">
            <input type="text" id="fullName" placeholder=" " />
            <label for="fullName">Full name</label>
            <span class="field-error" id="fullNameError"></span>
          </div>

          <div class="field floating">
            <input type="email" id="email" placeholder=" " />
            <label for="email">Email address</label>
            <span class="field-error" id="emailError"></span>
          </div>

          <div class="field">
            <div class="phone-row">
              <div class="phone-code-box" id="phoneCodeBox">+60</div>
              <div class="phone-input-box floating">
                <input
                  type="tel"
                  id="contactNumber"
                  placeholder=" "
                  maxlength="10"
                />
                <label for="contactNumber">Phone number</label>
              </div>
            </div>
            <span class="field-error" id="contactNumberError"></span>
          </div>

          <div class="field floating">
            <textarea id="coverNote" placeholder=" " rows="4"></textarea>
            <label for="coverNote">Cover letter (optional)</label>
            <span class="field-error" id="coverNoteError"></span>
          </div>

          <h2 class="section-label">Resume</h2>

          <div class="field">
            <label class="upload-box" id="uploadBox" for="resumeFile">
              <span id="uploadText">Click to upload your resume</span>
              <span class="upload-hint">PDF only, max 5MB</span>
              <input
                type="file"
                id="resumeFile"
                accept=".pdf,application/pdf"
                hidden
              />
            </label>
            <span class="field-error" id="resumeFileError"></span>
          </div>

          <button type="submit" class="submit-btn">Submit Application</button>

          <p id="statusMsg" class="status"></p>
        </form>
      </div>
    </main>

    <script type="module" src="js/apply-job.js"></script>
    <script type="module">
      import { initLogoNav } from "../../shared/logo-nav.js";
      initLogoNav();
    </script>
    <script type="module">
      import { initAccountMenu } from "../../shared/account-menu.js";
      initAccountMenu();
    </script>
  </body>
</html>
