<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Professional Profile - CariMakan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/professional-profile.css" />
    <link rel="stylesheet" href="../../shared/logo.css" />
    <link rel="stylesheet" href="../../shared/account-menu.css" />
  </head>
  <body>
    <header class="topbar">
      <a href="#" id="logoLink" class="logo">Cari<span>Makan</span></a>
      <nav class="topnav">
        <div class="account-menu">
          <button id="accountMenuBtn" class="account-menu-trigger">
            Account ▾
          </button>
          <div class="account-dropdown" id="accountDropdown">
            <a href="profile.html">My Account</a>
            <button id="logoutBtn">Log Out</button>
          </div>
        </div>
      </nav>
    </header>

    <main class="page-content">
      <div class="form-card">
        <h1>Professional Profile</h1>
        <p class="section-hint">
          Employers will review this information before contacting you.
        </p>

        <form id="professionalProfileForm" novalidate>
          <h2 class="section-label">Summary</h2>

          <div class="field floating">
            <textarea id="summary" placeholder=" " rows="4"></textarea>
            <label for="summary">Professional Summary</label>
            <span class="field-error" id="summaryError"></span>
          </div>

          <h2 class="section-label">Education</h2>
          <div id="educationList"></div>
          <button type="button" id="addEducationBtn" class="add-row-btn">
            + Add Education
          </button>

          <h2 class="section-label">Work Experience</h2>
          <div id="workExperienceList"></div>
          <button type="button" id="addExperienceBtn" class="add-row-btn">
            + Add Work Experience
          </button>

          <h2 class="section-label">Skills</h2>
          <div class="field floating">
            <input type="text" id="skills" placeholder=" " />
            <label for="skills">Skills (comma separated)</label>
            <span class="field-error" id="skillsError"></span>
          </div>

          <h2 class="section-label">Resume</h2>
          <div class="field">
            <label class="upload-box" id="uploadBox" for="resumeFile">
              <span id="uploadText">Click to upload your resume</span>
              <span class="upload-hint">PDF only, max 5MB</span>
              <input
                type="file"
                id="resumeFile"
                accept=".pdf,application/pdf"
                hidden
              />
            </label>
            <span class="field-error" id="resumeFileError"></span>
            <p id="currentResumeInfo" class="current-resume-info"></p>
          </div>

          <button type="submit" class="submit-btn">Save Changes</button>
          <p id="statusMsg" class="status"></p>
        </form>
      </div>
    </main>

    <script type="module" src="js/professional-profile.js"></script>
    <script type="module">
      import { initLogoNav } from "../../shared/logo-nav.js";
      initLogoNav();
    </script>
    <script type="module">
      import { initAccountMenu } from "../../shared/account-menu.js";
      initAccountMenu();
    </script>
  </body>
</html>
